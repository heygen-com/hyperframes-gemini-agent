<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"How it works","maxLength":36},
    {"id":"step_1","type":"string","label":"Step 1","default":"Connect your data source","maxLength":44},
    {"id":"step_2","type":"string","label":"Step 2","default":"Pick a template","maxLength":44},
    {"id":"step_3","type":"string","label":"Step 3","default":"Generate and share","maxLength":44},
    {"id":"summary","type":"string","label":"Closing line","default":"Three steps. That is it.","maxLength":48},
    {"id":"bg_color","type":"color","label":"Background color","default":"#101418"},
    {"id":"accent_color","type":"color","label":"Accent color","default":"#42d6a4"},
    {"id":"text_color","type":"color","label":"Text color","default":"#eef2f0"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>explainer</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: Helvetica, Arial, sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 220px;
        box-sizing: border-box;
      }
      #title {
        font-size: 110px;
        font-weight: 800;
        opacity: 0;
        margin-bottom: 80px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 48px;
        margin: 28px 0;
        opacity: 0;
      }
      .step .num {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 52px;
        font-weight: 800;
        flex: 0 0 auto;
      }
      .step .label {
        font-size: 64px;
        font-weight: 500;
      }
      #summary {
        font-size: 72px;
        font-weight: 700;
        opacity: 0;
        margin-top: 80px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="explainer"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="14"
      data-fps="30"
    >
      <!-- Plain flow children of the flex #stage; GSAP drives the reveal.
           NOT .clip (the runtime force-absolutes .clip nodes, which would
           stack them on top of each other). -->
      <div id="title"></div>
      <div class="step" id="s1"><div class="num">1</div><div class="label"></div></div>
      <div class="step" id="s2"><div class="num">2</div><div class="label"></div></div>
      <div class="step" id="s3"><div class="num">3</div><div class="label"></div></div>
      <div id="summary"></div>

      <!-- Voiceover audio: `__VOICEOVER_URL__` is substituted at customize time
           (renderer needs a static src); stripped when there's no narration. -->
      <audio id="voiceover" data-start="0" data-duration="14" data-track-index="0" data-volume="1" src="__VOICEOVER_URL__"></audio>

      <script>
        const {
          title = "How it works",
          step_1 = "Connect your data source",
          step_2 = "Pick a template",
          step_3 = "Generate and share",
          summary = "Three steps. That is it.",
          bg_color = "#101418",
          accent_color = "#42d6a4",
          text_color = "#eef2f0",
        } = window.__hyperframes.getVariables();

        document.body.style.background = bg_color;
        document.body.style.color = text_color;
        const $ = (id) => document.getElementById(id);

        $("title").textContent = title;
        $("title").style.color = text_color;
        const steps = [step_1, step_2, step_3];
        ["s1", "s2", "s3"].forEach((id, i) => {
          const el = $(id);
          el.querySelector(".label").textContent = steps[i];
          const num = el.querySelector(".num");
          num.style.background = accent_color;
          num.style.color = bg_color;
        });
        $("summary").textContent = summary;
        $("summary").style.color = accent_color;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.3);
        tl.fromTo("#s1", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.6);
        tl.fromTo("#s2", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.8);
        tl.fromTo("#s3", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.0);
        tl.fromTo("#summary", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.3)" }, 8.6);
        tl.to(["#title", "#s1", "#s2", "#s3", "#summary"], { opacity: 0, duration: 0.6, ease: "power1.in" }, 13.0);
        window.__timelines["explainer"] = tl;
      </script>
    </div>
  </body>
</html>
